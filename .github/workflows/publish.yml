name: Publish to Thunderstore

on:
  workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
                    persist-credentials: false
            -   uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    global-json-file: global.json
            -   name: Build and publish Thunderstore package
                env:
                    TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
                run: dotnet build -c Release -t:PackTS -P:PublishTS=true
